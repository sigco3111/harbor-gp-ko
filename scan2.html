<!doctype html><html lang="en"><meta charset="utf-8"><title>extract</title>
<body><pre id="out">loading</pre>
<script>
const P=new URLSearchParams(location.search);
const PAGE=+(P.get('p')||1), N=+(P.get('n')||200);
function unesc(s){return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ')}
(async()=>{
 const h=await (await fetch('index.html')).text();
 let ov=''; try{ov=await (await fetch('ko/ko-overlay.js')).text()}catch(e){}
 const regs=[]; const re=/<script[^>]*>([\s\S]*?)<\/script>/gi; let m;
 while((m=re.exec(h))){const a=m.index+m[0].indexOf('>')+1; regs.push([a,a+m[1].length])}
 const sregs=[]; const sre=/<style[^>]*>([\s\S]*?)<\/style>/gi;
 while((m=sre.exec(h))){const a=m.index+m[0].indexOf('>')+1; sregs.push([a,a+m[1].length])}
 const inR=(pos,rs)=>{for(const r of rs){if(pos>=r[0]&&pos<r[1])return true}return false};
 const found=[];
 const tre=/>([^<>]+)</g;
 while((m=tre.exec(h))){const pos=m.index; if(inR(pos,regs)||inR(pos,sregs))continue; const t=unesc(m[1]).trim(); if(t)found.push(t)}
 const are=/(placeholder|title|aria-label|alt|value|data-label)="([^"]*)"/g;
 while((m=are.exec(h))){const t=unesc(m[2]).trim(); if(t)found.push(t)}
 for(const r of regs){const body=h.slice(r[0],r[1]); const lit=/'((?:[^'\\\n]|\\.)*)'|"((?:[^"\\\n]|\\.)*)"|`((?:[^`\\]|\\.)*)`/g; let k;
   while((k=lit.exec(body))){let t=(k[1]||k[2]||k[3]||'').replace(/\\n/g,' ').replace(/\s+/g,' ').trim(); if(t)found.push(t)}}
 const STOP=new Set(['div','span','click','none','block','flex','absolute','fixed','relative','hidden','visible','button','keydown','keyup','touch','pointer','true','false','null','undefined','string','number','auto','ease','linear','inherit','transform','color','background','white','black','window','document','body','canvas']);
 function keep(t){ if(t.length<2||t.length>520)return false; if(!/[A-Za-z]/.test(t))return false; if(STOP.has(t.toLowerCase()))return false; if(/^[a-z0-9_\-]+$/.test(t)&&t.length>3)return false; if(/^[#.\[:]/.test(t))return false; if(/(px\b|rgba?\(|url\(|===|&&|\|\||=>|querySelector|addEventListener|https?:\/\/|data:|function\b)/.test(t))return false; if(/^[A-Za-z0-9_\-]+$/.test(t)&&t.length>20)return false; return true}
 const cnt=new Map();
 for(const t of found){ if(!keep(t))continue; cnt.set(t,(cnt.get(t)||0)+1)}
 const keys=new Set(); const kr=/^\s*"((?:[^"\\]|\\.)*)"\s*:\s*"/gm; let q; while((q=kr.exec(ov)))keys.add(q[1].toLowerCase().replace(/\s+/g,' '));
 const un=[...cnt.keys()].filter(t=>!keys.has(t.toLowerCase().replace(/\s+/g,' ')));
 un.sort((a,b)=>(cnt.get(b)-cnt.get(a))||(a<b?-1:1));
 const pages=Math.ceil(un.length/N)||1; const st=(PAGE-1)*N; const sl=un.slice(st,st+N);
 let out='total '+cnt.size+' | uncovered '+un.length+' | page '+PAGE+'/'+pages+'\n';
 for(const t of sl) out+='['+cnt.get(t)+'] '+t+'\n';
 document.getElementById('out').textContent=out;
})();
</script>
